    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kaung Si Thu",
        "jobTitle": "Frontend-Heavy Full-Stack Developer",
        "description": "Recruiter-friendly overview of Kaung Si Thu's experience, selected work, and contact details.",
        "sameAs": [
          "https://github.com/kaungsithu202",
          "https://www.linkedin.com/in/kaung-si-thu-7079ba23b/",
          "https://x.com/karl2021998"
        ]
      }
    </script>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
                ? "dark"
                : "light";

          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Sora:wght@600;700&display=swap"
